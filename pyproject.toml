[build-system]
# setuptools>=61 is the low-version floor for PEP 621 [project] metadata;
# newer setuptools also works (reliable fallback chain, no hard upper pin).
# The SPDX `license` field below is understood by setuptools>=77; setup.py
# feeds older setuptools a temporary legacy-compatible copy (see setup.py).
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cos-comparison"
version = "0.5.3"
description = "Local similarity comparison for feature extraction - biologically inspired, zero-training edge/pattern detection, multi-backend acceleration."
readme = "README.md"
# Modern SPDX license metadata (PEP 639).  The PEP 621 table form
# (`license = {text = ...}`) is deprecated on setuptools>=77; this string
# form needs setuptools>=77, while the Python 3.8 floor allows 61 - so
# setup.py installs a build-time shim that hands pre-77 setuptools a
# temporary legacy-compatible sibling copy.  This file (and every sdist)
# always keeps the modern form.
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Li Jinxin", email = "lijinxin_gx@sina.cn"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["cosine similarity", "local comparison", "AGI", "feature extraction", "edge detection", "template matching"]
dependencies = []

[project.urls]
Homepage = "https://github.com/LiJinxin-gx/cos-comparison"
Repository = "https://github.com/LiJinxin-gx/cos-comparison.git"
"Issue Tracker" = "https://github.com/LiJinxin-gx/cos-comparison/issues"
Documentation = "https://cos-comparison.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["."]
include = ["cos_comparison*"]
exclude = ["tests*", "dist*", "*.egg-info*"]
namespaces = false

[tool.setuptools.package-data]
cos_comparison = [
    # Core configuration
    "core/config.json",
    # C-family source files (for reference / manual compilation);
    # open extension set so extended toolchains/platforms ship as-is
    "core/include/*.c",
    "core/include/*.h",
    "**/*.c", "**/*.cc", "**/*.cpp", "**/*.cxx", "**/*.cu",
    "**/*.h", "**/*.hpp", "**/*.hh", "**/*.hxx", "**/*.cuh",
    "**/*.inl", "**/*.inc", "**/*.m", "**/*.mm",
    # Compiled extension artifacts (open platform set: Windows .pyd/.dll,
    # Unix .so (+ versioned .so.*)/.sl, macOS .dylib)
    "**/*.pyd",
    "**/*.so",
    "**/*.so.*",
    "**/*.dylib",
    "**/*.dll",
    "**/*.sl",
    # Type stubs
    "**/*.pyi",
    # Version file (runtime version source of truth)
    "VERSION.txt",
]

[tool.pytest.ini_options]
pythonpath = ["explore", "tests"]
testpaths = ["tests"]
